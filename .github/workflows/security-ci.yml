name: Security CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate source and security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate tracked source
        run: node scripts/security-ci.js

      - name: Run regression suite
        run: node --test tests/*.test.js

      - name: Validate local release gates
        run: node scripts/release-audit.js --mode local

      - name: Audit locked npm dependencies when present
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
