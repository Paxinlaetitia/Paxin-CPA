<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><meta name="theme-color" content="#050505" /><title>Redefinir senha — Paxinbot</title><link rel="icon" href="/assets/paxinbot-mark.svg" type="image/svg+xml" /><link rel="stylesheet" href="/styles.css" /></head>
<body><main class="auth-callback"><section class="auth-card"><div class="auth-head"><div class="auth-logo"><img src="assets/paxinbot-mark.svg" alt="" /></div><div><span>SEGURANÇA DA CONTA</span><h1>Nova senha</h1></div></div><p class="auth-copy">Escolha uma senha exclusiva para sua conta Paxinbot.</p><form id="password-reset-form" class="auth-form"><label>Nova senha<span class="auth-input"><svg><use href="#i-lock"></use></svg><input name="password" type="password" minlength="10" autocomplete="new-password" required /></span></label><label>Confirme a nova senha<span class="auth-input"><svg><use href="#i-lock"></use></svg><input name="confirm" type="password" minlength="10" autocomplete="new-password" required /></span></label><button class="button button-primary button-full" type="submit">Salvar nova senha</button></form><p id="password-reset-status" class="auth-legal"></p></section></main><script>
document.getElementById('password-reset-form').addEventListener('submit', async event => { event.preventDefault(); const form = event.currentTarget; const status = document.getElementById('password-reset-status'); const data = new FormData(form); if (data.get('password') !== data.get('confirm')) { status.textContent = 'As senhas precisam ser iguais.'; return; } const button = form.querySelector('button'); button.disabled = true; try { const response = await fetch('/api/auth/password', { method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body:JSON.stringify({password:data.get('password')}) }); const payload = await response.json(); if (!response.ok) throw new Error(payload.error); status.textContent = 'Senha atualizada. Redirecionando para sua conta…'; setTimeout(() => location.replace('/conta'), 900); } catch (error) { status.textContent = error.message || 'Não foi possível atualizar a senha.'; } finally { button.disabled = false; } });
</script><script src="/site-shell.js"></script></body></html>
