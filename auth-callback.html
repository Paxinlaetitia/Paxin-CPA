<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><meta name="theme-color" content="#050505" /><title>Conectando sua conta — Paxinbot</title><link rel="icon" href="assets/paxinbot-mark.svg" type="image/svg+xml" /><link rel="stylesheet" href="styles.css" /></head>
<body><main class="auth-callback"><section class="auth-card"><div class="auth-head"><div class="auth-logo"><img src="assets/paxinbot-mark.svg" alt="" /></div><div><span>ACESSO SEGURO</span><h1>Conectando sua conta</h1></div></div><p id="callback-status" class="auth-copy">Validando a autenticação no domínio Paxinbot…</p><a class="button button-secondary button-full" href="cliente.html">Voltar para a Área do Cliente</a></section></main><script>
(async () => {
  const status = document.getElementById('callback-status');
  const hash = new URLSearchParams(location.hash.slice(1));
  const params = new URLSearchParams(location.search);
  const error = hash.get('error_description') || params.get('error_description') || hash.get('error');
  if (error) { status.textContent = `Não foi possível concluir: ${error}.`; return; }
  const accessToken = hash.get('access_token'); const refreshToken = hash.get('refresh_token');
  if (!accessToken || !refreshToken) { status.textContent = 'A confirmação foi concluída. Entre na sua conta para continuar.'; return; }
  try {
    // Form encoding usa o parser nativo da Vercel para callbacks OAuth. Os
    // valores continuam no corpo HTTPS e não são anexados à URL da API.
    const response = await fetch('/api/auth/session', { method:'POST', credentials:'include', headers:{'content-type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({accessToken,refreshToken}) });
    if (!response.ok) throw new Error();
    location.replace(params.get('flow') === 'recovery' || hash.get('type') === 'recovery' ? 'redefinir-senha.html' : 'cliente.html');
  } catch { status.textContent = 'Não foi possível salvar sua sessão. Volte e entre novamente.'; }
})();
</script></main></body></html>
