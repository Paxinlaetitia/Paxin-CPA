<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><meta name="theme-color" content="#050505" /><title>Conectando sua conta — Paxinbot</title><link rel="icon" href="/assets/paxinbot-mark.svg" type="image/svg+xml" /><link rel="stylesheet" href="/styles.css" /></head>
<body><main class="auth-callback"><section class="auth-card"><div class="auth-head"><div class="auth-logo"><img src="assets/paxinbot-mark.svg" alt="" /></div><div><span>ACESSO SEGURO</span><h1>Conectando sua conta</h1></div></div><p id="callback-status" class="auth-copy">Validando a autenticação no domínio Paxinbot…</p><a class="button button-secondary button-full" href="/conta">Voltar para a Área do Cliente</a></section></main><script>
(async () => {
  const status = document.getElementById('callback-status');
  const hash = new URLSearchParams(location.hash.slice(1));
  const params = new URLSearchParams(location.search);
  const error = hash.get('error_description') || params.get('error_description') || hash.get('error');
  if (error) { status.textContent = `Não foi possível concluir: ${error}.`; return; }
  const accessToken = hash.get('access_token'); const refreshToken = hash.get('refresh_token');
  if (!accessToken) { status.textContent = 'A confirmação foi concluída. Entre na sua conta para continuar.'; return; }
  try {
    // Form encoding usa o parser nativo da Vercel para callbacks OAuth. Os
    // valores continuam no corpo HTTPS e não são anexados à URL da API.
    const response = await fetch('/api/auth/session', { method:'POST', credentials:'include', headers:{'content-type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({accessToken,refreshToken: refreshToken || ''}) });
    if (!response.ok) throw new Error();
    if (params.get('flow') === 'passkey') sessionStorage.setItem('paxinbot_passkey_session', JSON.stringify({ accessToken, refreshToken: refreshToken || '' }));
    let safeReturn='/conta';
    try { const candidate=sessionStorage.getItem('paxinbot_auth_return') || ''; sessionStorage.removeItem('paxinbot_auth_return'); const parsed=new URL(candidate,location.origin); const productId=parsed.searchParams.get('product') || ''; if (parsed.origin===location.origin && parsed.pathname==='/conta/checkout' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(productId) && parsed.searchParams.size===1) safeReturn=`/conta/checkout?product=${encodeURIComponent(productId)}`; } catch {}
    location.replace(params.get('flow') === 'recovery' || hash.get('type') === 'recovery' ? '/redefinir-senha' : params.get('flow') === 'passkey' ? '/conta/seguranca' : safeReturn);
  } catch { status.textContent = 'Não foi possível salvar sua sessão. Volte e entre novamente.'; }
})();
</script></body></html>
